

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: martial_arts_db
    environment:
      POSTGRES_DB: martial_arts_db
      POSTGRES_USER: martial_user
      POSTGRES_PASSWORD: abc12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martial_user -d martial_arts_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para Channels y Celery
  redis:
    image: redis:7-alpine
    container_name: martial_arts_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Django (ASGI con Daphne)
  web:
    build: .
    container_name: martial_arts_web
    command: daphne -b 0.0.0.0 -p 8000 martial_arts_api.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://martial_user:abc12345@db:5432/martial_arts_db
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery_worker:
    build: .
    container_name: martial_arts_celery_worker
    command: celery -A martial_arts_api worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://martial_user:abc12345@db:5432/martial_arts_db
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # Celery Beat (Scheduler)
  celery_beat:
    build: .
    container_name: martial_arts_celery_beat
    command: celery -A martial_arts_api beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://martial_user:abc12345@db:5432/martial_arts_db
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

