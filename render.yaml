# Render.com Blueprint Configuration
# Este archivo permite desplegar todos los servicios de una vez

services:
  # Backend Django API
  - type: web
    name: martial-arts-api
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT martial_arts_api.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: martial-arts-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: martial-arts-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://martial-arts-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://martial-arts-frontend.onrender.com

  # Celery Worker
  - type: worker
    name: martial-arts-celery-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A martial_arts_api worker --loglevel=info
    envVars:
      - key: SECRET_KEY
        fromService:
          name: martial-arts-api
          type: web
          property: envVar
          value: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: martial-arts-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString

  # Celery Beat (Scheduler)
  - type: worker
    name: martial-arts-celery-beat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A martial_arts_api beat --loglevel=info
    envVars:
      - key: SECRET_KEY
        fromService:
          name: martial-arts-api
          type: web
          property: envVar
          value: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: martial-arts-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: martial-arts-redis
          type: redis
          property: connectionString

databases:
  - name: martial-arts-db
    plan: free
    databaseName: martial_arts_db
    user: martial_user

# Redis Service
services:
  - type: redis
    name: martial-arts-redis
    plan: free
    maxmemoryPolicy: allkeys-lru





