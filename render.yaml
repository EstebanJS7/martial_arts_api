# Render.com Blueprint Configuration

envVarGroups:
  - name: martial-arts-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TIME_ZONE
        value: America/Asuncion
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

services:
  - type: web
    name: martial-arts-api
    runtime: python
    buildCommand: python3.12 -m pip install -r requirements.txt && python3.12 manage.py collectstatic --noinput
    preDeployCommand: bash -lc 'python3.12 manage.py migrate --noinput && if [ "$RUN_DEMO_SEED" = "true" ]; then python3.12 manage.py seed_demo_data --allow-production; fi'
    startCommand: python3.12 -m daphne -b 0.0.0.0 -p $PORT martial_arts_api.asgi:application
    healthCheckPath: /health/
    envVars:
      - fromGroup: martial-arts-shared
      - key: ALLOWED_HOSTS
        value: your-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: martial-arts-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: RUN_DEMO_SEED
        value: "false"
      - key: ALLOW_DEMO_SEED
        value: "false"

  - type: worker
    name: martial-arts-celery-worker
    runtime: python
    buildCommand: python3.12 -m pip install -r requirements.txt
    startCommand: python3.12 -m celery -A martial_arts_api worker --loglevel=info
    envVars:
      - fromGroup: martial-arts-shared
      - key: DATABASE_URL
        fromDatabase:
          name: martial-arts-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString

  - type: worker
    name: martial-arts-celery-beat
    runtime: python
    buildCommand: python3.12 -m pip install -r requirements.txt
    startCommand: python3.12 -m celery -A martial_arts_api beat --loglevel=info
    envVars:
      - fromGroup: martial-arts-shared
      - key: DATABASE_URL
        fromDatabase:
          name: martial-arts-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: martial-arts-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: martial-arts-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: martial-arts-db
    plan: free
    databaseName: martial_arts_db
    user: martial_user

